<!-- ============ CHAT (TÚ) ============ -->
      <sc-if value="{{is.chat}}" hint-placeholder-val="">
        <div style="height:100vh;display:flex">
          <div style="width:300px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column">
            <div style="padding:20px 20px 14px"><h1 style="font-size:20px;font-weight:700;margin:0">Chat</h1></div>
            <div style="flex:1;overflow-y:auto">
              <sc-for list="{{convosView}}" as="c" hint-placeholder-count="3">
                <div style="display:flex;align-items:center;gap:11px;padding:13px 18px;cursor:pointer;border-left:2px solid {{c.activeBorder}};background:{{c.activeBg}}" style-hover="background:var(--hover)">
                  <div style="width:38px;height:38px;border-radius:10px;background:{{c.color}};display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px;flex-shrink:0">{{c.initials}}</div>
                  <div style="flex:1;min-width:0">
                    <div style="display:flex;justify-content:space-between;gap:6px"><span style="font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.name}}</span><span style="font-size:11px;color:var(--text-faint);flex-shrink:0">{{c.time}}</span></div>
                    <div style="font-size:12.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.last}}</div>
                  </div>
                  <sc-if value="{{c.unread}}" hint-placeholder-val=""><span style="min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">{{c.unread}}</span></sc-if>
                </div>
              </sc-for>
            </div>
          </div>
          <div style="flex:1;display:flex;flex-direction:column;min-width:0">
            <div style="display:flex;align-items:center;gap:11px;padding:14px 22px;border-bottom:1px solid var(--border)">
              <div style="width:36px;height:36px;border-radius:10px;background:#ff6b4a;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px">LT</div>
              <div><div style="font-weight:600;font-size:15px">Los Tarántula</div><div style="font-size:12px;color:var(--text-muted)">5 miembros</div></div>
            </div>
            <div style="flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:12px">
              <sc-for list="{{messages}}" as="m" hint-placeholder-count="4">
                <div style="display:flex;gap:9px;align-self:{{m.align}};max-width:72%;align-items:flex-end">
                  <sc-if value="{{m.showAvatar}}" hint-placeholder-val=""><div style="width:28px;height:28px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--text-muted);font-size:11px;flex-shrink:0">{{m.initials}}</div></sc-if>
                  <div>
                    <div style="background:{{m.bubbleBg}};color:{{m.bubbleCol}};padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.4">{{m.text}}</div>
                    <div style="font-size:10.5px;color:var(--text-faint);margin-top:3px;padding:0 4px">{{m.byline}}</div>
                  </div>
                </div>
              </sc-for>
            </div>
            <div style="padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px">
              <input value="{{chatInput}}" oninput="{{onChatInput}}" onkeydown="{{onChatKey}}" placeholder="Escribe un mensaje…" style="flex:1;padding:11px 15px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:11px;color:var(--text);font-size:14.5px;outline:none" style-focus="border-color:var(--accent)">
              <button onclick="{{sendMsg}}" style="width:44px;height:44px;border-radius:11px;background:var(--accent);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="filter:brightness(1.08)"><i data-lucide="send" style="width:18px;height:18px"></i></button>
            </div>
          </div>
        </div>
      </sc-if>
