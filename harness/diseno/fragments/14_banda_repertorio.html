<!-- ============ BANDA · REPERTORIO ============ -->
      <sc-if value="{{is.bRepertorio}}" hint-placeholder-val="">
        <div style="max-width:1000px;margin:0 auto;padding:32px 38px 60px">
          <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px">
            <div><h1 style="font-size:24px;font-weight:700;margin:0 0 4px">Repertorio</h1><p style="color:var(--text-muted);margin:0;font-size:14.5px">Canciones de {{currentBand.name}}.</p></div>
            <button style="display:flex;align-items:center;gap:7px;padding:10px 15px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer" style-hover="filter:brightness(1.07)"><i data-lucide="plus" style="width:16px;height:16px"></i>Añadir</button>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px">
            <sc-for list="{{bandSongs}}" as="s" hint-placeholder-count="3">
              <div onclick="{{s.play}}" style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px;cursor:pointer" style-hover="border-color:var(--border-strong)">
                <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px">
                  <div style="width:40px;height:40px;border-radius:10px;background:{{s.bandBg}};display:flex;align-items:center;justify-content:center;color:{{s.bandColor}}"><i data-lucide="music" style="width:19px;height:19px"></i></div>
                  <div style="width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff"><i data-lucide="play" style="width:14px;height:14px;margin-left:1px"></i></div>
                </div>
                <div style="font-weight:600;font-size:15px;margin-bottom:12px">{{s.title}}</div>
                <div style="display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono';font-size:12px;color:var(--text-faint)"><span style="padding:2px 7px;border-radius:6px;background:var(--surface-3);color:var(--text-muted);font-weight:600">{{s.key}}</span><span>{{s.bpm}} BPM</span><span style="margin-left:auto">{{s.dur}}</span></div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>
