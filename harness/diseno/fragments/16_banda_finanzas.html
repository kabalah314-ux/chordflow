<!-- ============ BANDA · FINANZAS ============ -->
      <sc-if value="{{is.bFinanzas}}" hint-placeholder-val="">
        <div style="max-width:920px;margin:0 auto;padding:32px 38px 60px">
          <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px">
            <div><h1 style="font-size:24px;font-weight:700;margin:0 0 4px">Finanzas de la banda</h1><p style="color:var(--text-muted);margin:0;font-size:14.5px">Caja común, saldos por miembro y movimientos.</p></div>
            <div style="display:flex;gap:9px">
              <button onclick="{{liquidar}}" style="padding:10px 15px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font-weight:600;font-size:13.5px;cursor:pointer" style-hover="background:var(--hover)">Liquidar</button>
              <button onclick="{{registrarMov}}" style="display:flex;align-items:center;gap:7px;padding:10px 15px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer" style-hover="filter:brightness(1.07)"><i data-lucide="plus" style="width:16px;height:16px"></i>Registrar</button>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1.2fr;gap:18px">
            <div>
              <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px">
                <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:6px">Caja de la banda</div>
                <div style="font-size:28px;font-weight:700;font-family:'IBM Plex Mono';color:{{bandTotalColor}}">{{bandTotalText}}</div>
              </div>
              <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden">
                <div style="padding:13px 16px;font-size:13px;font-weight:600;color:var(--text-muted);border-bottom:1px solid var(--border)">Saldo por miembro</div>
                <sc-for list="{{memberBalsView}}" as="m" hint-placeholder-count="5">
                  <div style="display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--border)">
                    <div style="width:30px;height:30px;border-radius:50%;background:{{m.color}};display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:11px">{{m.initials}}</div>
                    <span style="flex:1;font-size:14px;font-weight:500">{{m.name}}</span>
                    <span style="font-family:'IBM Plex Mono';font-size:14px;font-weight:600;color:{{m.balColor}}">{{m.balText}}</span>
                  </div>
                </sc-for>
              </div>
            </div>
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden">
              <div style="padding:13px 16px;font-size:13px;font-weight:600;color:var(--text-muted);border-bottom:1px solid var(--border)">Movimientos</div>
              <sc-for list="{{bandMovsView}}" as="m" hint-placeholder-count="4">
                <div style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border)">
                  <div style="width:34px;height:34px;border-radius:9px;background:{{m.iconBg}};display:flex;align-items:center;justify-content:center;color:{{m.iconCol}}"><i data-lucide="{{m.icon}}" style="width:16px;height:16px"></i></div>
                  <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">{{m.desc}}</div><div style="font-size:12px;color:var(--text-muted)">{{m.by}} · {{m.date}}</div></div>
                  <span style="font-family:'IBM Plex Mono';font-size:14px;font-weight:600;color:{{m.amountColor}}">{{m.amountText}}</span>
                </div>
              </sc-for>
            </div>
          </div>
        </div>
      </sc-if>
