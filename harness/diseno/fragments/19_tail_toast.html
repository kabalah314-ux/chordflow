  // ---- helpers ----
  transposeChord(ch,n){
    if(!ch) return ch;
    const flats={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#','Cb':'B','Fb':'E'};
    return ch.split('/').map(part=>{
      const m = part.match(/^([A-G])(#|b)?(.*)$/);
      if(!m) return part;
      let root = m[1]+(m[2]||'');
      if(flats[root]) root=flats[root];
      let i=this.NOTES.indexOf(root);
      if(i<0) return part;
      i=(i+n+120)%12;
      return this.NOTES[i]+m[3];
    }).join('/');
  }
  roleMeta(role){
    if(role==='admin') return {label:'Admin', color:'#f5b94a', bg:'rgba(245,185,74,.16)'};
    if(role==='member') return {label:'Miembro', color:'#6f9bf5', bg:'rgba(111,155,245,.16)'};
    return {label:'Invitado', color:'#c08cff', bg:'rgba(192,140,255,.16)'};
  }
  fmtEur(n,sign){
    const a = Math.abs(n).toFixed(2).replace('.',',');
    const s = n>0?(sign?'+':''):(n<0?'−':'');
    return s + a + ' €';
  }

  bandWeak(id){ const b=this.bands.find(x=>x.id===id); if(!b) return 'var(--surface-3)'; return b.color.replace('#','rgba(')+'X'; }

    const h=hex.replace('#',''); const r=parseInt(h.substring(0,2),16),g=parseInt(h.substring(2,4),16),b=parseInt(h.substring(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }

      invite:()=>this.showToast('Invitación enviada por email'),
      registrarMov:()=>this.showToast('Movimiento registrado'),
      liquidar:()=>this.showToast('Cuentas liquidadas entre miembros'),
      bandTotalText:this.fmtEur(bandTotal,false), bandTotalColor: bandTotal>=0?'var(--success)':'var(--danger)',
      setlistView, setlistTotal,
      player, sheetRef:this.sheetRef,
      counts:{bands:this.bands.length, songs:this.songs.length, sheets:this.songs.filter(x=>x.sheet).length},
      // theme + band banner colors
      themeIcon: s.theme==='dark'?'sun':'moon', themeLabel: s.theme==='dark'?'Tema claro':'Tema oscuro',
      bandBgValue: this.hexToRgba(currentBandRaw.color,.10), bandBorderValue: this.hexToRgba(currentBandRaw.color,.35),
      // login
      loginCta: s.loginTab==='entrar'?'Entrar':'Crear cuenta',
      loginTabEntrar:{bg: s.loginTab==='entrar'?'var(--surface)':'transparent', col: s.loginTab==='entrar'?'var(--text)':'var(--text-muted)'},
      loginTabRegistro:{bg: s.loginTab==='registro'?'var(--surface)':'transparent', col: s.loginTab==='registro'?'var(--text)':'var(--text-muted)'},
      setLoginTab:{entrar:()=>this.setState({loginTab:'entrar'}), registro:()=>this.setState({loginTab:'registro'})},
      login:()=>this.login(),
      // handlers
      toggleTheme:()=>this.toggleTheme(), goHome:()=>this.go('inicio'), goPerfil:()=>this.go('perfil'),
      goAgenda:()=>this.go('agenda'), goChat:()=>this.go('chat'), exitBand:()=>this.exitBand(),
      togglePlay:()=>this.togglePlay(), bpmUp:()=>this.bpmUp(), bpmDown:()=>this.bpmDown(),
      transposeUp:()=>this.transposeUp(), transposeDown:()=>this.transposeDown(),
      toggleAutoscroll:()=>this.toggleAutoscroll(), closePlayer:()=>this.closePlayer(),
      toast:s.toast,
    };
  }
}
</script>
