<!-- ===================== APP SHELL ===================== -->
  <sc-if value="{{is.app}}" hint-placeholder-val="">
    <!-- SIDEBAR -->
    <aside style="width:252px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh">
      <div onclick="{{goHome}}" style="display:flex;align-items:center;gap:10px;padding:18px 18px 14px;cursor:pointer">
        <div style="width:30px;height:30px;border-radius:9px;background:var(--accent);display:flex;align-items:flex-end;justify-content:center;gap:2.5px;padding:7px 0">
          <span style="width:3px;height:55%;background:#fff;border-radius:2px"></span>
          <span style="width:3px;height:100%;background:#fff;border-radius:2px"></span>
          <span style="width:3px;height:40%;background:#fff;border-radius:2px"></span>
        </div>
        <span style="font-size:17px;font-weight:700;letter-spacing:-.02em">BandFlow</span>
      </div>

      <!-- band banner (band context) -->
      <sc-if value="{{is.bandCtx}}" hint-placeholder-val="">
        <div style="margin:4px 12px 10px;padding:12px;border-radius:13px;background:{{bandBgValue}};border:1px solid {{bandBorderValue}};position:relative;overflow:hidden">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
            <div style="width:38px;height:38px;border-radius:10px;background:{{currentBand.color}};display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;flex-shrink:0">{{currentBand.initials}}</div>
            <div style="min-width:0">
              <div style="font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{currentBand.name}}</div>
              <div style="font-size:11.5px;color:var(--text-muted)">{{currentBand.genre}}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
            <span style="font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:{{currentBand.roleBg}};color:{{currentBand.roleColor}}">{{currentBand.roleLabel}}</span>
            <button onclick="{{exitBand}}" style="display:flex;align-items:center;gap:4px;background:transparent;border:none;color:var(--text-muted);font-size:12.5px;font-weight:600;cursor:pointer;padding:3px 6px;border-radius:7px" style-hover="background:var(--hover);color:var(--text)"><i data-lucide="chevron-left" style="width:14px;height:14px"></i>Salir</button>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{is.youCtx}}" hint-placeholder-val="">
        <div style="padding:2px 14px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text-faint);text-transform:uppercase">Tú</div>
      </sc-if>

      <nav style="flex:1;overflow-y:auto;padding:2px 12px;display:flex;flex-direction:column;gap:2px">
        <sc-for list="{{navItems}}" as="n" hint-placeholder-count="6">
          <div onclick="{{n.go}}" style="display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:14.5px;font-weight:500;color:{{n.color}};background:{{n.bg}}" style-hover="background:var(--hover)">
            <i data-lucide="{{n.icon}}" style="width:18px;height:18px"></i>
            <span>{{n.label}}</span>
            <sc-if value="{{n.badge}}" hint-placeholder-val=""><span style="margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">{{n.badge}}</span></sc-if>
          </div>
        </sc-for>
      </nav>

      <div style="padding:10px 12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px">
        <div onclick="{{goPerfil}}" style="display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:9px;cursor:pointer" style-hover="background:var(--hover)">
          <div style="width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:12px">DV</div>
          <div style="min-width:0">
            <div style="font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Dani Vega</div>
            <div style="font-size:11.5px;color:var(--text-faint)">Mi perfil</div>
          </div>
          <i data-lucide="settings" style="width:15px;height:15px;color:var(--text-faint);margin-left:auto"></i>
        </div>
        <button onclick="{{toggleTheme}}" style="display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;background:transparent;border:none;color:var(--text-muted);font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;width:100%" style-hover="background:var(--hover)">
          <i data-lucide="{{themeIcon}}" style="width:17px;height:17px"></i><span>{{themeLabel}}</span>
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <main style="flex:1;height:100vh;overflow-y:auto;position:relative">
