<!-- ============ BIBLIOTECA ============ -->
      <sc-if value="{{is.biblioteca}}" hint-placeholder-val="">
        <div style="max-width:1080px;margin:0 auto;padding:32px 38px 60px">
          <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap">
            <div>
              <h1 style="font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px">Biblioteca</h1>
              <p style="color:var(--text-muted);margin:0;font-size:15px">Todo tu repertorio, personal y de tus bandas.</p>
            </div>
            <button style="display:flex;align-items:center;gap:7px;padding:10px 15px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer" style-hover="filter:brightness(1.07)"><i data-lucide="plus" style="width:16px;height:16px"></i>Añadir canción</button>
          </div>
          <div style="position:relative;margin-bottom:14px">
            <i data-lucide="search" style="width:17px;height:17px;color:var(--text-faint);position:absolute;left:13px;top:50%;transform:translateY(-50%)"></i>
            <input value="{{libQuery}}" oninput="{{onLibSearch}}" placeholder="Buscar por título o banda…" style="width:100%;padding:11px 13px 11px 38px;background:var(--surface);border:1px solid var(--border-strong);border-radius:11px;color:var(--text);font-size:14.5px;outline:none" style-focus="border-color:var(--accent)">
          </div>
          <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
            <sc-for list="{{libChips}}" as="c" hint-placeholder-count="5">
              <button onclick="{{c.go}}" style="padding:7px 13px;border-radius:20px;border:1px solid {{c.border}};background:{{c.bg}};color:{{c.col}};font-size:13px;font-weight:600;cursor:pointer">{{c.label}}</button>
            </sc-for>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px">
            <sc-for list="{{songsView}}" as="s" hint-placeholder-count="8">
              <div onclick="{{s.play}}" style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px;cursor:pointer;position:relative;transition:border-color .15s" style-hover="border-color:var(--border-strong)">
                <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px">
                  <div style="width:40px;height:40px;border-radius:10px;background:{{s.bandBg}};display:flex;align-items:center;justify-content:center;color:{{s.bandColor}}"><i data-lucide="music" style="width:19px;height:19px"></i></div>
                  <div style="width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff" style-hover="filter:brightness(1.1)"><i data-lucide="play" style="width:14px;height:14px;margin-left:1px"></i></div>
                </div>
                <div style="font-weight:600;font-size:15px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{s.title}}</div>
                <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:12px">{{s.bandName}}</div>
                <div style="display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono';font-size:12px;color:var(--text-faint)">
                  <span style="padding:2px 7px;border-radius:6px;background:var(--surface-3);color:var(--text-muted);font-weight:600">{{s.key}}</span>
                  <span>{{s.bpm}} BPM</span>
                  <span style="margin-left:auto">{{s.dur}}</span>
                </div>
                <sc-if value="{{s.sheet}}" hint-placeholder-val=""><div style="position:absolute;top:15px;left:62px;font-size:10px;font-weight:600;color:var(--success);background:var(--success-weak);padding:2px 6px;border-radius:5px">PARTITURA</div></sc-if>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>
