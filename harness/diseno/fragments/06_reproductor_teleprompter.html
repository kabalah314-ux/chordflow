<!-- ============ REPRODUCTOR / TELEPROMPTER ============ -->
      <sc-if value="{{is.player}}" hint-placeholder-val="">
        <div style="height:100vh;display:flex;flex-direction:column;background:var(--app-bg)">
          <div style="display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--border);flex-shrink:0">
            <button onclick="{{closePlayer}}" style="width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:var(--hover)"><i data-lucide="chevron-left" style="width:18px;height:18px"></i></button>
            <div style="flex:1;min-width:0">
              <div style="font-size:18px;font-weight:700;letter-spacing:-.01em">{{player.title}}</div>
              <div style="font-size:13px;color:var(--text-muted)">{{player.band}}</div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono';font-size:13px;color:var(--text-muted)"><i data-lucide="circle-dot" style="width:14px;height:14px;color:var(--accent)"></i>Tono <span style="color:var(--text);font-weight:600">{{player.keyDisplay}}</span></div>
          </div>

          <div ref="{{sheetRef}}" style="flex:1;overflow-y:auto;padding:40px 26px 220px">
            <div style="max-width:760px;margin:0 auto">
              <sc-for list="{{player.sections}}" as="sec" hint-placeholder-count="3">
                <div style="margin-bottom:30px">
                  <div style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:14px">{{sec.name}}</div>
                  <sc-for list="{{sec.lines}}" as="line" hint-placeholder-count="2">
                    <div style="display:flex;flex-wrap:wrap;gap:{{line.gap}};margin-bottom:16px;align-items:flex-end">
                      <sc-for list="{{line.segs}}" as="g" hint-placeholder-count="4">
                        <div style="display:flex;flex-direction:column;gap:4px">
                          <span style="font-family:'IBM Plex Mono';font-weight:600;line-height:1;align-self:flex-start;transition:all .15s;font-size:{{g.size}};padding:{{g.pad}};border-radius:9px;background:{{g.bg}};color:{{g.col}}">{{g.chord}}</span>
                          <sc-if value="{{g.text}}" hint-placeholder-val=""><span style="font-size:22px;line-height:1.4;color:var(--text)">{{g.text}}</span></sc-if>
                        </div>
                      </sc-for>
                    </div>
                  </sc-for>
                </div>
              </sc-for>
            </div>
          </div>

          <!-- transport -->
          <div style="position:absolute;left:0;right:0;bottom:0;padding:18px 26px 22px;background:linear-gradient(to top,var(--app-bg) 55%,transparent);pointer-events:none">
            <div style="max-width:760px;margin:0 auto;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:18px;padding:14px 18px;box-shadow:var(--shadow);pointer-events:auto">
              <div style="height:4px;border-radius:3px;background:var(--surface-3);margin-bottom:14px;overflow:hidden"><div style="height:100%;width:{{player.progress}};background:var(--accent);border-radius:3px;transition:width .2s"></div></div>
              <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
                <div style="display:flex;align-items:center;gap:8px">
                  <span style="font-size:11px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em">BPM</span>
                  <button onclick="{{bpmDown}}" style="width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center" style-hover="background:var(--hover)">−</button>
                  <span style="font-family:'IBM Plex Mono';font-weight:600;font-size:17px;min-width:38px;text-align:center">{{player.bpm}}</span>
                  <button onclick="{{bpmUp}}" style="width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center" style-hover="background:var(--hover)">+</button>
                </div>
                <button onclick="{{togglePlay}}" style="width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px var(--accent-weak)" style-hover="filter:brightness(1.08)"><i data-lucide="{{player.playIcon}}" style="width:22px;height:22px;margin-left:{{player.playNudge}}"></i></button>
                <div style="display:flex;align-items:center;gap:8px">
                  <span style="font-size:11px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em">Tono</span>
                  <button onclick="{{transposeDown}}" style="width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center" style-hover="background:var(--hover)">♭</button>
                  <span style="font-family:'IBM Plex Mono';font-weight:600;font-size:15px;min-width:30px;text-align:center;color:var(--accent)">{{player.transposeLabel}}</span>
                  <button onclick="{{transposeUp}}" style="width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center" style-hover="background:var(--hover)">♯</button>
                </div>
                <button onclick="{{toggleAutoscroll}}" style="margin-left:auto;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;border:1px solid {{player.asBorder}};background:{{player.asBg}};color:{{player.asColor}};font-size:13px;font-weight:600;cursor:pointer"><i data-lucide="chevrons-down" style="width:15px;height:15px"></i>Auto-scroll</button>
              </div>
            </div>
          </div>
        </div>
      </sc-if>
