<!-- ============ BANDA · AGENDA ============ -->
      <sc-if value="{{is.bAgenda}}" hint-placeholder-val="">
        <div style="max-width:820px;margin:0 auto;padding:32px 38px 60px">
          <h1 style="font-size:24px;font-weight:700;margin:0 0 18px">Agenda de {{currentBand.name}}</h1>
          <div style="display:flex;flex-direction:column;gap:12px">
            <sc-for list="{{bandEvents}}" as="e" hint-placeholder-count="2">
              <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;border-left:3px solid {{currentBand.color}}">
                <div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">
                  <div style="text-align:center;width:48px"><div style="font-size:11px;color:var(--text-faint);font-weight:600">{{e.dow}}</div><div style="font-size:23px;font-weight:700;line-height:1">{{e.day}}</div></div>
                  <div style="flex:1"><div style="font-weight:600;font-size:15.5px">{{e.title}}</div><div style="font-size:13px;color:var(--text-muted)">{{e.time}} · {{e.place}}</div></div>
                  <div style="display:flex;gap:6px">
                    <sc-for list="{{e.rsvpOpts}}" as="o" hint-placeholder-count="3"><button onclick="{{o.set}}" style="padding:6px 11px;border-radius:8px;border:1px solid {{o.border}};background:{{o.bg}};color:{{o.col}};font-size:12.5px;font-weight:600;cursor:pointer">{{o.label}}</button></sc-for>
                  </div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted);padding-top:10px;border-top:1px solid var(--border)"><i data-lucide="list-music" style="width:14px;height:14px;color:var(--accent)"></i>Setlist asignado · 5 canciones</div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>
