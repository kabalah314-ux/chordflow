<!-- ============ BANDA · CHAT ============ -->
      <sc-if value="{{is.bChat}}" hint-placeholder-val="">
        <div style="height:100vh;display:flex;flex-direction:column">
          <div style="display:flex;align-items:center;gap:11px;padding:16px 26px;border-bottom:1px solid var(--border)">
            <div style="width:36px;height:36px;border-radius:10px;background:{{currentBand.color}};display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px">{{currentBand.initials}}</div>
            <div><div style="font-weight:600;font-size:15px">{{currentBand.name}}</div><div style="font-size:12px;color:var(--text-muted)">{{currentBand.members}} miembros</div></div>
          </div>
          <div style="flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:12px">
            <sc-for list="{{messages}}" as="m" hint-placeholder-count="4">
              <div style="display:flex;gap:9px;align-self:{{m.align}};max-width:72%;align-items:flex-end">
                <sc-if value="{{m.showAvatar}}" hint-placeholder-val=""><div style="width:28px;height:28px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--text-muted);font-size:11px;flex-shrink:0">{{m.initials}}</div></sc-if>
                <div><div style="background:{{m.bubbleBg}};color:{{m.bubbleCol}};padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.4">{{m.text}}</div><div style="font-size:10.5px;color:var(--text-faint);margin-top:3px;padding:0 4px">{{m.byline}}</div></div>
              </div>
            </sc-for>
          </div>
          <div style="padding:16px 26px;border-top:1px solid var(--border);display:flex;gap:10px">
            <input value="{{chatInput}}" oninput="{{onChatInput}}" onkeydown="{{onChatKey}}" placeholder="Escribe un mensaje…" style="flex:1;padding:11px 15px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:11px;color:var(--text);font-size:14.5px;outline:none" style-focus="border-color:var(--accent)">
            <button onclick="{{sendMsg}}" style="width:44px;height:44px;border-radius:11px;background:var(--accent);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="filter:brightness(1.08)"><i data-lucide="send" style="width:18px;height:18px"></i></button>
          </div>
        </div>
      </sc-if>
