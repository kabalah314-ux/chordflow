<!-- ============ AGENDA (TÚ) ============ -->
      <sc-if value="{{is.agenda}}" hint-placeholder-val="">
        <div style="max-width:920px;margin:0 auto;padding:32px 38px 60px">
          <div style="margin-bottom:20px">
            <h1 style="font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px">Agenda</h1>
            <p style="color:var(--text-muted);margin:0;font-size:15px">Ensayos y bolos de todas tus bandas.</p>
          </div>
          <div style="display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap">
            <sc-for list="{{agChips}}" as="c" hint-placeholder-count="4">
              <button onclick="{{c.go}}" style="padding:7px 13px;border-radius:20px;border:1px solid {{c.border}};background:{{c.bg}};color:{{c.col}};font-size:13px;font-weight:600;cursor:pointer">{{c.label}}</button>
            </sc-for>
          </div>
          <div style="display:flex;flex-direction:column;gap:12px">
            <sc-for list="{{agendaView}}" as="e" hint-placeholder-count="4">
              <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;display:flex;gap:16px;align-items:center;border-left:3px solid {{e.bandColor}}">
                <div style="text-align:center;width:50px;flex-shrink:0">
                  <div style="font-size:11px;color:var(--text-faint);font-weight:600">{{e.dow}}</div>
                  <div style="font-size:24px;font-weight:700;line-height:1">{{e.day}}</div>
                </div>
                <div style="flex:1;min-width:0">
                  <div style="display:flex;align-items:center;gap:9px;margin-bottom:3px;flex-wrap:wrap">
                    <span style="font-weight:600;font-size:15.5px">{{e.title}}</span>
                    <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:{{e.bandBg}};color:{{e.bandColor}}">{{e.bandName}}</span>
                    <sc-if value="{{e.isBolo}}" hint-placeholder-val=""><span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--accent-weak);color:var(--accent)">Bolo</span></sc-if>
                  </div>
                  <div style="font-size:13px;color:var(--text-muted)">{{e.time}} · {{e.place}}</div>
                </div>
                <div style="display:flex;gap:6px;flex-shrink:0">
                  <sc-for list="{{e.rsvpOpts}}" as="o" hint-placeholder-count="3">
                    <button onclick="{{o.set}}" style="padding:6px 11px;border-radius:8px;border:1px solid {{o.border}};background:{{o.bg}};color:{{o.col}};font-size:12.5px;font-weight:600;cursor:pointer">{{o.label}}</button>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>
