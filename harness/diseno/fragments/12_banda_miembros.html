<!-- ============ BANDA · MIEMBROS ============ -->
      <sc-if value="{{is.bMiembros}}" hint-placeholder-val="">
        <div style="max-width:820px;margin:0 auto;padding:32px 38px 60px">
          <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px">
            <div><h1 style="font-size:24px;font-weight:700;margin:0 0 4px">Miembros</h1><p style="color:var(--text-muted);margin:0;font-size:14.5px">{{currentBand.members}} personas en {{currentBand.name}}.</p></div>
            <button onclick="{{invite}}" style="display:flex;align-items:center;gap:7px;padding:10px 15px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer" style-hover="filter:brightness(1.07)"><i data-lucide="user-plus" style="width:16px;height:16px"></i>Invitar</button>
          </div>
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden">
            <sc-for list="{{membersView}}" as="m" hint-placeholder-count="5">
              <div style="display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border)">
                <div style="width:42px;height:42px;border-radius:50%;background:{{m.color}};display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px">{{m.initials}}</div>
                <div style="flex:1"><div style="font-weight:600;font-size:15px">{{m.name}}</div><div style="font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:6px"><i data-lucide="music" style="width:13px;height:13px"></i>{{m.instrument}}</div></div>
                <span style="font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;background:{{m.roleBg}};color:{{m.roleColor}}">{{m.roleLabel}}</span>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>
