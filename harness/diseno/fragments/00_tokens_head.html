<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#0d0d10;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  [data-bf-theme="dark"]{
    --app-bg:#0d0d10;--surface:#16161b;--surface-2:#1c1c23;--surface-3:#23232c;
    --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.15);
    --text:#ededf1;--text-muted:#9a9aa6;--text-faint:#6a6a76;
    --hover:rgba(255,255,255,.05);--accent:#ff6b4a;--accent-weak:rgba(255,107,74,.16);
    --success:#2dd4a7;--success-weak:rgba(45,212,167,.15);--danger:#ff5d6c;--danger-weak:rgba(255,93,108,.15);
    --warning:#f5c518;--warning-weak:rgba(245,197,24,.15);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);--shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
  [data-bf-theme="light"]{
    --app-bg:#f5f5f2;--surface:#ffffff;--surface-2:#fafaf8;--surface-3:#f0f0ec;
    --border:rgba(20,20,30,.10);--border-strong:rgba(20,20,30,.18);
    --text:#1a1a20;--text-muted:#5d5d68;--text-faint:#8c8c96;
    --hover:rgba(20,20,30,.04);--accent:#ee5530;--accent-weak:rgba(238,85,48,.12);
