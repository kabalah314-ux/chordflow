<!-- ============ PERFIL ============ -->
      <sc-if value="{{is.perfil}}" hint-placeholder-val="">
        <div style="max-width:760px;margin:0 auto;padding:32px 38px 60px">
          <h1 style="font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 22px">Perfil</h1>
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:18px;display:flex;align-items:center;gap:20px">
            <div style="width:76px;height:76px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:28px">DV</div>
            <div style="flex:1">
              <div style="font-size:21px;font-weight:700">Dani Vega</div>
              <div style="font-size:14px;color:var(--text-muted)">hola@danivega.es</div>
            </div>
            <button style="padding:9px 15px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);font-weight:600;font-size:13.5px;cursor:pointer" style-hover="background:var(--hover)">Editar</button>
          </div>
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:18px">
            <div style="font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:12px">Mis instrumentos</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <span style="display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:20px;background:var(--accent-weak);color:var(--accent);font-size:13.5px;font-weight:600"><i data-lucide="music" style="width:15px;height:15px"></i>Guitarra</span>
              <span style="display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:20px;background:var(--accent-weak);color:var(--accent);font-size:13.5px;font-weight:600"><i data-lucide="music" style="width:15px;height:15px"></i>Contrabajo</span>
              <span style="display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:20px;background:var(--accent-weak);color:var(--accent);font-size:13.5px;font-weight:600"><i data-lucide="mic" style="width:15px;height:15px"></i>Voz</span>
              <button style="padding:7px 13px;border-radius:20px;border:1px dashed var(--border-strong);background:transparent;color:var(--text-muted);font-size:13.5px;font-weight:600;cursor:pointer">+ Añadir</button>
            </div>
          </div>
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px">
            <div style="font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:12px">Mis bandas</div>
            <div style="display:flex;flex-direction:column;gap:4px">
              <sc-for list="{{bandsView}}" as="b" hint-placeholder-count="3">
                <div onclick="{{b.enter}}" style="display:flex;align-items:center;gap:12px;padding:11px;border-radius:11px;cursor:pointer" style-hover="background:var(--hover)">
                  <div style="width:36px;height:36px;border-radius:10px;background:{{b.color}};display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px">{{b.initials}}</div>
                  <div style="flex:1"><div style="font-weight:600;font-size:14.5px">{{b.name}}</div><div style="font-size:12.5px;color:var(--text-muted)">{{b.instrument}}</div></div>
                  <span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:{{b.roleBg}};color:{{b.roleColor}}">{{b.roleLabel}}</span>
                </div>
              </sc-for>
            </div>
          </div>
        </div>
      </sc-if>
