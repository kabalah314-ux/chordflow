name: CI

# T-V6-21: CI por jobs (lint+unit rápido · e2e con navegador), acciones fijadas por SHA, permisos
# mínimos, cancelación de ejecuciones obsoletas y artefactos de diagnóstico si algo falla.
# Misma "definición de terminado" que en local (harness/run_checks.py), partida en dos fases.
on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false   # e2e tarda: no matar la ejecución en curso (la pendiente se sustituye)

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Crear .env dummy (CI no tiene secretos commiteados)
        run: |
          printf 'LOG_LEVEL=INFO\n' > .env
          printf 'SUPABASE_URL=https://dummy.supabase.co\nSUPABASE_ANON_KEY=dummy-anon-key-for-ci\n' > .env.local

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Cache-busting al día
        run: python harness/cachebust.py --check

      - name: Tests unitarios (API + lógica)
        run: python -m pytest tests/unit -m unit -q

      # T-V6-22: vulnerabilidades conocidas en las dependencias de runtime (aviso, no bloquea aún)
      - name: Auditoría de dependencias (pip-audit)
        continue-on-error: true
        run: |
          python -m pip install pip-audit==2.7.3
          python -m pip_audit -r requirements.txt --progress-spinner off

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint-unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Instalar navegador de Playwright
        run: python -m playwright install --with-deps chromium

      - name: Crear .env dummy (CI no tiene secretos commiteados)
        run: |
          printf 'LOG_LEVEL=INFO\n' > .env
          printf 'SUPABASE_URL=https://dummy.supabase.co\nSUPABASE_ANON_KEY=dummy-anon-key-for-ci\n' > .env.local

      - name: Doctor (entorno + smoke)
        run: python harness/doctor.py

      - name: Tests e2e (navegador)
        run: python -m pytest tests/e2e -m e2e -q --tracing=retain-on-failure --output=test-results

      - name: Guardar diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-diagnostico
          path: |
            test-results
            test_e2e_server.log
          if-no-files-found: ignore
          retention-days: 7
