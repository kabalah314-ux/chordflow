name: Migraciones (Postgres)

# T-V6-23: la cadena de Alembic se prueba contra Postgres (producción) en su propio workflow, para
# que no espere a la e2e.
on:
  push:
    branches: ["**"]
    paths: ["alembic/**", "src/services/models.py", "src/services/db.py", ".github/workflows/migraciones.yml"]

permissions:
  contents: read

concurrency:
  group: migr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # T-V6-23 (Q-02/Q-17): la cadena de migraciones debe funcionar en POSTGRES (producción), no solo
  # en SQLite: upgrade desde cero, sin drift con los modelos, y downgrade completo.
  migraciones-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bandflow
          POSTGRES_PASSWORD: bandflow
          POSTGRES_DB: bandflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bandflow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bandflow:bandflow@localhost:5432/bandflow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: .env dummy
        run: printf 'SUPABASE_URL=https://dummy.supabase.co\nSUPABASE_ANON_KEY=dummy\n' > .env.local
      - name: alembic upgrade head (desde cero)
        run: python -m alembic upgrade head
      - name: alembic check (sin drift)
        run: python -m alembic check
      - name: alembic downgrade base y vuelta a head
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head

