name: Backup diario

# T-V6-72: volcado diario de la base de datos de producción como artefacto (7 días).
# Inofensivo hasta que Oscar cree el secreto BACKUP_DATABASE_URL (pooler de sesión, puerto 5432).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
    steps:
      - name: ¿Hay secreto?
        id: chk
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Sin BACKUP_DATABASE_URL: no se hace copia."; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.chk.outputs.skip != '1'
      - name: pg_dump
        if: steps.chk.outputs.skip != '1'
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          python harness/backup_db.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.chk.outputs.skip != '1'
        with:
          name: bandflow-backup
          path: backups/*.dump
          retention-days: 7
