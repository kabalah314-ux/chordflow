# Configuración de Alembic para ChordFlow (T-011).
# La URL de la base de datos NO se fija aquí: env.py la lee de la variable de entorno
# DATABASE_URL (igual que src/services/db.py), para no hardcodear rutas ni duplicar config.

[alembic]
script_location = alembic
prepend_sys_path = .
# Formato de los ficheros de versión: fecha + slug, más legible que solo el hash.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
