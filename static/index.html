<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0f0f14">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ChordFlow Player</title>
    <link rel="stylesheet" href="style.css?v=ba3f2049">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Top Bar: Song Info & Global Controls -->
        <header class="glass-panel top-bar">
            <div class="song-info">
                <h1 id="song-title">Cargando...</h1>
                <h2 id="song-artist"></h2>
            </div>
            <div class="global-controls" style="display: flex; gap: 1rem;">
                <div class="control-group">
                    <button id="btn-bpm-down" class="icon-btn" aria-label="Bajar BPM" title="Bajar BPM">-</button>
                    <div class="bpm-display">
                        <span id="bpm-value">120</span> <span class="label">BPM</span>
                    </div>
                    <button id="btn-bpm-up" class="icon-btn" aria-label="Subir BPM" title="Subir BPM">+</button>
                </div>
                <div class="control-group">
                    <button id="btn-key-down" class="icon-btn" aria-label="Bajar semitono" title="Bajar semitono">♭</button>
                    <div class="bpm-display">
                        <span id="key-value">0</span> <span class="label">Tono</span>
                    </div>
                    <button id="btn-key-up" class="icon-btn" aria-label="Subir semitono" title="Subir semitono">♯</button>
                    <button id="btn-key-save" class="icon-btn" aria-label="Guardar tono" title="Guardar tono">💾</button>
                </div>
                <button id="btn-print" class="primary-btn square" aria-label="Exportar a PDF" title="Exportar / Imprimir (PDF)" style="background: rgba(255,255,255,0.08); color: var(--text-primary);">🖨️</button>
                <a href="library.html" class="primary-btn square" aria-label="Ir a la biblioteca" title="Biblioteca" style="text-decoration: none; background: rgba(255,255,255,0.08); color: var(--text-primary);">📚</a>
                <a href="editor.html" class="primary-btn square" aria-label="Crear partitura" title="Crear Partitura" style="text-decoration: none;">➕</a>
            </div>
        </header>

        <!-- Main Content: The Score -->
        <main id="score-container">
            <div class="scroll-anchor"></div>
            <!-- Dynamic content will be injected here -->
            <div id="score-content"></div>
        </main>

        <!-- Bottom Bar: Playback Controls -->
        <footer class="glass-panel bottom-bar">
            <div class="playback-controls">
                <button id="btn-metronome" class="primary-btn square" aria-label="Metrónomo (clic por beat)" title="Metrónomo (clic por beat)" style="background: rgba(255,255,255,0.08); color: var(--text-primary);">🥁</button>
                <button id="btn-stop" class="primary-btn square" aria-label="Detener">⏹</button>
                <button id="btn-play-pause" class="primary-btn" aria-label="Reproducir o pausar (barra espaciadora)">▶ Play</button>
            </div>
            <div class="time-display">
                <span id="current-beat-display">Beat: 0.0</span>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.js"
            integrity="sha384-EjUdIVmzWliPzdzhxZ9ZoO0etXLKWuUPUftAGxP6qH6Lm4oLwoLaJR0Ba4pIDiDL"
            crossorigin="anonymous"></script>
    <script src="auth.js?v=f9a03bd3"></script>
    <script src="util.js?v=eb457792"></script>
    <script src="sync_engine.js?v=64c07151"></script>
    <script src="score_render.js?v=d66bbc20"></script>
    <script src="chord_shapes.js?v=c04dafa3"></script>
    <script src="app.js?v=1ea338d1"></script>
</body>
</html>
