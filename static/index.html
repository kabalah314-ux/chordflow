<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0d0d10">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>BandFlow Player</title>
    <!-- D-EST-2 (GUIA_MAESTRA_V5 §2.4): el reproductor es "modo escenario", SIEMPRE oscuro.
         Por eso NO carga theme.js — sin `data-theme`, design-system/style.css usan el tema oscuro
         por defecto pase lo que pase que el usuario elija en el resto de la app. NO añadir theme.js aquí. -->
    <link rel="stylesheet" href="design-system.css?v=47faa1ea">
    <link rel="stylesheet" href="style.css?v=ba63c30d">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Top Bar: Song Info & Global Controls -->
        <header class="glass-panel top-bar">
            <div class="song-info">
                <h1 id="song-title">Cargando...</h1>
                <h2 id="song-artist"></h2>
            </div>
            <div class="global-controls">
                <!-- Zona 1: transporte/tempo -->
                <div class="tb-zone">
                    <div class="control-group">
                        <button id="btn-bpm-down" class="icon-btn" aria-label="Bajar BPM" title="Bajar BPM">-</button>
                        <div class="bpm-display">
                            <span id="bpm-value">120</span> <span class="label">BPM</span>
                        </div>
                        <button id="btn-bpm-up" class="icon-btn" aria-label="Subir BPM" title="Subir BPM">+</button>
                    </div>
                    <div class="control-group">
                        <button id="btn-key-down" class="icon-btn" aria-label="Bajar semitono" title="Bajar semitono">♭</button>
                        <div class="bpm-display">
                            <span id="key-value">0</span> <span class="label">Tono</span>
                        </div>
                        <button id="btn-key-up" class="icon-btn" aria-label="Subir semitono" title="Subir semitono">♯</button>
                        <button id="btn-key-save" class="icon-btn" aria-label="Guardar tono" title="Guardar tono">💾</button>
                    </div>
                </div>
                <span class="tb-sep" aria-hidden="true"></span>
                <!-- Zona 2: herramientas -->
                <div class="tb-zone">
                    <button id="btn-tuner" class="primary-btn square tool-btn" aria-label="Afinador" title="Afinador">🎤</button>
                    <button id="btn-reference" class="primary-btn square tool-btn" aria-label="Vídeo de referencia" title="Vídeo de referencia" style="display:none;">🎬</button>
                    <button id="btn-print" class="primary-btn square tool-btn" aria-label="Exportar a PDF" title="Exportar / Imprimir (PDF)">🖨️</button>
                </div>
                <span class="tb-sep" aria-hidden="true"></span>
                <!-- Zona 3: navegación -->
                <div class="tb-zone">
                    <button id="btn-shortcuts" class="primary-btn square tool-btn" aria-label="Atajos de teclado" title="Atajos de teclado">?</button>
                    <a href="app.html" class="primary-btn square tool-btn" aria-label="Ir al inicio" title="Inicio" style="text-decoration: none;">🏠</a>
                    <a href="library.html" class="primary-btn square tool-btn" aria-label="Ir a la biblioteca" title="Biblioteca" style="text-decoration: none;">📚</a>
                    <a href="editor.html" class="primary-btn square" aria-label="Crear partitura" title="Crear Partitura" style="text-decoration: none;">➕</a>
                </div>
            </div>
        </header>

        <!-- Barra de repertorio (visible solo si se abre desde un setlist) -->
        <div id="setlist-nav" class="setlist-nav" style="display:none;"></div>

        <!-- Main Content: The Score -->
        <main id="score-container">
            <div class="scroll-anchor"></div>
            <!-- Dynamic content will be injected here -->
            <div id="score-content"></div>
        </main>

        <!-- Bottom Bar: Playback Controls -->
        <footer class="glass-panel bottom-bar">
            <!-- Bolita de posición (V3-F2, T-088): progreso en la canción + sección actual -->
            <div class="song-progress" id="song-progress" aria-hidden="true">
                <div class="song-progress__fill" id="song-progress-fill"></div>
                <div class="song-progress__dot" id="song-progress-dot"></div>
            </div>
            <div class="playback-controls">
                <button id="btn-countin" class="primary-btn square countin-btn" aria-label="Cuenta atrás antes de reproducir: 4 golpes" title="Cuenta atrás antes del Play (clic: apagada · 4 · 8)" style="background: var(--accent-color); color: #000;">4</button>
                <button id="btn-metronome" class="primary-btn square" aria-label="Metrónomo (clic por beat)" title="Metrónomo (clic por beat)" style="background: rgba(255,255,255,0.08); color: var(--text-primary);">🥁</button>
                <button id="btn-stop" class="primary-btn square" aria-label="Detener">⏹</button>
                <button id="btn-play-pause" class="primary-btn" aria-label="Reproducir o pausar (barra espaciadora)">▶ Play</button>
                <button id="btn-stage" class="primary-btn square" aria-label="Modo Directo (pantalla completa)" title="Modo Directo" style="background: rgba(255,255,255,0.08); color: var(--text-primary);">⛶</button>
            </div>
            <div class="time-display">
                <span id="current-section-display" class="section-chip"></span>
                <span id="current-beat-display" data-beat="0.00">Compás 1</span>
            </div>
        </footer>

        <!-- Panel de vídeo de referencia (V3-F4, T-090): se muestra si la canción tiene reference_url -->
        <div id="reference-panel" class="reference-panel" style="display:none;">
            <button id="btn-reference-close" class="reference-panel__close" aria-label="Cerrar referencia">✕</button>
            <div id="reference-embed"></div>
        </div>

        <!-- Cuenta atrás pre-roll (T-V5-08): overlay grande 4-3-2-1 antes de arrancar. -->
        <div id="countin-overlay" class="countin-overlay" hidden aria-hidden="true"><span id="countin-num"></span></div>

        <!-- Panel del afinador (V3-F4, T-091) -->
        <div id="tuner-panel" class="tuner-panel" style="display:none;">
            <button id="tuner-close" class="reference-panel__close" aria-label="Cerrar afinador">✕</button>
            <div class="tuner-note" id="tuner-note">—</div>
            <div class="tuner-cents" id="tuner-cents"></div>
            <div class="tuner-meter"><div class="tuner-needle" id="tuner-needle"></div></div>
            <p class="tuner-msg" id="tuner-msg"></p>
            <button id="tuner-start" class="secondary-btn">Activar micrófono</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.js"
            integrity="sha384-EjUdIVmzWliPzdzhxZ9ZoO0etXLKWuUPUftAGxP6qH6Lm4oLwoLaJR0Ba4pIDiDL"
            crossorigin="anonymous"></script>
    <script src="auth.js?v=32867392"></script>
    <script src="icons.js?v=ce9a2bcd"></script>
    <script src="util.js?v=3e6f794b"></script>
    <script src="sync_engine.js?v=64c07151"></script>
    <script src="score_render.js?v=a8810431"></script>
    <script src="chord_shapes.js?v=c04dafa3"></script>
    <script src="metronome.js?v=1225794b"></script>
    <script src="app.js?v=875cd9e2"></script>
    <script src="tuner.js?v=dab0e123"></script>
</body>
</html>
