<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="theme.js?v=5283f341"></script> <!-- T-V6-14: tema antes del primer pintado (sin flash) -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0d0d10">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>BandFlow — Biblioteca</title>
    <!-- style.css: estilos del contenido (tarjetas, buscador, filtros). design-system+shell: el shell. -->
    <link rel="stylesheet" href="style.css?v=09e817bb">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="design-system.css?v=c5569b2b">
    <link rel="stylesheet" href="shell.css?v=c32e5231">
</head>
<body>
    <div class="bf-shell">
        <main class="bf-shell-main">
            <div class="bf-page bf-page--wide">
                <div class="bf-row bf-row--between bf-wrap" style="margin-bottom:1.25rem;">
                    <div>
                        <h1 class="bf-h1">Biblioteca</h1>
                        <p class="bf-muted">Tus partituras y el repertorio de tus bandas.</p>
                    </div>
                    <div class="bf-row" style="gap:.5rem;">
                        <a href="setlists.html" class="bf-btn" style="text-decoration:none;" data-icon="music">Setlists</a>
                        <a href="editor.html" class="bf-btn bf-btn--primary" style="text-decoration:none;" data-icon="plus">Nueva partitura</a>
                    </div>
                </div>
                <input type="search" id="search-input" class="search-box" placeholder="Buscar por título o artista...">
                <div id="library-filters" class="library-filters"></div>
                <div id="library-collections" class="library-collections"></div>
                <div id="song-grid" class="song-grid">
                    <p class="loading-text">Cargando canciones...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.js"
            integrity="sha384-EjUdIVmzWliPzdzhxZ9ZoO0etXLKWuUPUftAGxP6qH6Lm4oLwoLaJR0Ba4pIDiDL"
            crossorigin="anonymous"></script>
    <script src="auth.js?v=f39b3653"></script>
    <script src="util.js?v=ad808d5d"></script>
    <script src="icons.js?v=7180e165"></script>
    <script src="shell.js?v=b8004139"></script>
    <script src="library.js?v=f699e5d9"></script>
</body>
</html>
