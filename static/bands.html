<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0d0d10">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>BandFlow — Mis bandas</title>
    <link rel="stylesheet" href="style.css?v=13dca123">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header class="glass-panel top-bar">
            <div class="song-info">
                <h1>🎸 Mis bandas</h1>
                <h2>Crea tu banda, invita y gestionad juntos</h2>
            </div>
            <div class="global-controls" style="display:flex; align-items:center; gap:1rem;">
                <a href="app.html" class="primary-btn square" title="Inicio" style="text-decoration:none; background: rgba(255,255,255,0.08); color: var(--text-primary);">🏠</a>
                <a href="library.html" class="primary-btn square" title="Biblioteca" style="text-decoration:none; background: rgba(255,255,255,0.08); color: var(--text-primary);">📚</a>
                <a href="profile.html" class="primary-btn square" title="Mi perfil" style="text-decoration:none; background: rgba(255,255,255,0.08); color: var(--text-primary);">👤</a>
                <button id="btn-new-band" class="primary-btn">➕ Nueva banda</button>
            </div>
        </header>

        <main id="library-container">
            <div class="library-content">
                <!-- Lista de bandas -->
                <div id="bands-grid" class="song-grid">
                    <p class="loading-text">Cargando bandas…</p>
                </div>
                <!-- Detalle de una banda (oculto por defecto) -->
                <div id="band-detail" style="display:none;"></div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.js"
            integrity="sha384-EjUdIVmzWliPzdzhxZ9ZoO0etXLKWuUPUftAGxP6qH6Lm4oLwoLaJR0Ba4pIDiDL"
            crossorigin="anonymous"></script>
    <script src="auth.js?v=55a0092d"></script>
    <script src="util.js?v=c0e1df98"></script>
    <script src="bands.js?v=b67a5200"></script>
</body>
</html>
