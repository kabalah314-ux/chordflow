<!DOCTYPE html>

    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0d0d10">

    <title>BandFlow — Mis bandas</title>
    <!-- style.css: estilos del contenido reusado (tarjetas, modales). design-system+shell: el shell. -->

        <main class="bf-shell-main">
            <div class="bf-page bf-page--wide">
                <div class="bf-row bf-row--between bf-wrap" style="margin-bottom:1.25rem;">
                    <div>
                        <h1 class="bf-h1">Mis bandas</h1>
