<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0d0d10">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>BandFlow — Setlists</title>
    <!-- style.css: estilos del contenido (tarjetas, editor de setlist). design-system+shell: el shell. -->
    <link rel="stylesheet" href="style.css?v=a720d5b8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="design-system.css?v=f2033b77">
    <link rel="stylesheet" href="shell.css?v=61cb90f4">
</head>
<body>
    <div class="bf-shell">
        <main class="bf-shell-main">
            <div class="bf-page">
                <div class="bf-row bf-row--between bf-wrap" style="margin-bottom:1.25rem;">
                    <div>
                        <h1 class="bf-h1">🎵 Setlists</h1>
                        <p class="bf-muted">Tus listas de canciones en orden para cada bolo.</p>
                    </div>
                    <div class="bf-row" style="gap:.5rem;">
                        <button id="btn-new-setlist" class="bf-btn bf-btn--primary">➕ Nuevo setlist</button>
                    </div>
                </div>

                <!-- Vista lista de setlists -->
                <div id="setlist-grid" class="song-grid">
                    <p class="loading-text">Cargando setlists…</p>
                </div>

                <!-- Vista detalle de un setlist (oculta por defecto) -->
                <div id="setlist-detail" style="display:none;"></div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.js"
            integrity="sha384-EjUdIVmzWliPzdzhxZ9ZoO0etXLKWuUPUftAGxP6qH6Lm4oLwoLaJR0Ba4pIDiDL"
            crossorigin="anonymous"></script>
    <script src="auth.js?v=32867392"></script>
    <script src="util.js?v=ccbdf08e"></script>
    <script src="icons.js?v=85725364"></script>
    <script src="shell.js?v=097a330c"></script>
    <script src="setlists.js?v=65614266"></script>
</body>
</html>
