<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChordFlow — Entrar</title>
    <link rel="stylesheet" href="style.css?v=a484e174">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <main class="login-wrap">
            <div class="login-card glass-panel">
                <h1 class="login-logo">🎸 ChordFlow</h1>
                <p class="login-sub">Tus partituras, en cualquier dispositivo</p>

                <form id="login-form">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required autocomplete="email" placeholder="tu@email.com">
                    </div>
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" minlength="6">
                    </div>

                    <p id="login-msg" class="login-msg"></p>

                    <div class="login-actions">
                        <button type="submit" id="btn-login" class="primary-btn">Entrar</button>
                        <button type="button" id="btn-register" class="secondary-btn">Crear cuenta</button>
                    </div>
                </form>

                <div class="login-divider"><span>o</span></div>

                <button type="button" id="btn-google" class="google-btn">
                    <span style="font-weight:700;">G</span>&nbsp; Entrar con Google
                </button>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.js"
            integrity="sha384-EjUdIVmzWliPzdzhxZ9ZoO0etXLKWuUPUftAGxP6qH6Lm4oLwoLaJR0Ba4pIDiDL"
            crossorigin="anonymous"></script>
    <script src="auth.js?v=7604d85f"></script>
    <script src="login.js?v=39d7c69a"></script>
</body>
</html>
