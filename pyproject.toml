# Configuración de herramientas de calidad del harness ChordFlow.

[tool.pytest.ini_options]
# Rutas de descubrimiento de tests y marcadores.
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: pruebas rápidas sin navegador (API con TestClient, lógica)",
    "e2e: pruebas end-to-end con navegador (Playwright)",
]
# Salida legible.
addopts = "-ra -q"

[tool.ruff]
# Línea algo ancha porque el código existente usa cadenas largas en español.
line-length = 100
target-version = "py312"
# No tocar las carpetas generadas ni el frontend.
extend-exclude = ["__pycache__", ".venv", "venv", "logs", "static"]

[tool.ruff.lint]
# Reglas razonables sin ser agresivas (no romper el MVP existente).
select = ["E", "F", "W", "I"]   # errores, pyflakes, warnings, orden de imports
ignore = ["E501"]               # longitud de línea la controla black

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "static|logs"
